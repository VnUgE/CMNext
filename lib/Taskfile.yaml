#taskfile for building the libraries for admin and clients and creating their packages

version: "3.45"

vars:
  BINARY_DIR: '{{ .BINARY_DIR | default "bin" }}'

tasks:
  default:
    dir: "{{ .USER_WORKING_DIR }}"
    desc: "Runs a basic build of the project"
    cmds:
      - cmd: pnpm install
      - cmd: pnpm run build

  package-update:
    dir: "{{ .USER_WORKING_DIR }}"
    cmds:
      - pnpm update

  build:
    desc: "WARNING: For vnbuild use only. Do not run manually."
    dir: "{{ .USER_WORKING_DIR }}"
    cmds:
      - cmd: pnpm version {{ .BUILD_VERSION }}
        ignore_error: true #error if run when version is not updated
      #install deps and run build
      - cmd: pnpm install --frozen-lockfile
      - task: default

  #copy artifacts to temp directory
  postbuild_success:
    desc: "WARNING: For vnbuild use only. Do not run manually."
    dir: "{{ .USER_WORKING_DIR }}"
    cmds:
      #use pnpm pack to create a tarball of the package
      - cmd: mkdir -p {{ .BINARY_DIR }}
      - cmd: pnpm pack --pack-destination {{ .BINARY_DIR }}
      - cmd: cd {{ .BINARY_DIR }} && powershell mv -Force "*.tgz" "release.tgz"

  #clean hook
  clean:
    dir: "{{ .USER_WORKING_DIR }}"
    ignore_error: true
    cmds:
      - for: [node_modules/, dist/, bin/]
        cmd: rm -rf "{{ .ITEM }}"

  dev-init:
    desc: "Initializes the development environment"
    dir: "{{ .USER_WORKING_DIR }}"
    cmds:
      - cmd: pnpm install

  dev-init-all:
    cmds:
      - cmd: cd admin/ && task dev-init
      - cmd: cd client/ && task dev-init

  dev-all:
    desc: "Builds the front-end libraries during development"
    dir: "{{ .USER_WORKING_DIR }}"
    summary: |
      Can be used with the --watch flag to automatically build the libraries
      when files change. This is useful for development.
    sources:
      - admin/src/**
      - admin/src/**/.*
      - client/src/**
      - client/src/**/.*

    cmds:
      - cmd: cd admin && pnpm run build
      - cmd: cd client && pnpm run build
