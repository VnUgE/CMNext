#taskfile for building the libraries for admin and clients and creating their packages

version: '3'

vars:
  BINARY_DIR: '{{ .BINARY_DIR | default "bin" }}'

tasks:

  default:
    dir: '{{ .USER_WORKING_DIR }}'
    desc: 'Runs a basic build of the project'
    cmds:
      - cmd: npm run build

  package-update:
    dir: '{{ .USER_WORKING_DIR }}'
    cmds:
     - npm update

  build:
    desc: 'WARNING: For vnbuild use only. Do not run manually.'
    dir: '{{ .USER_WORKING_DIR }}'
    cmds:
    - cmd: npm version {{ .BUILD_VERSION }}
      ignore_error: true #error if run when version is not updated
    #install deps and run build
    - cmd: npm install
    - task: default

  #copy artifacts to temp directory
  postbuild_success:
    desc: 'WARNING: For vnbuild use only. Do not run manually.'
    dir: '{{ .USER_WORKING_DIR }}'
    cmds:
    #use npm pack to create a tarball of the package
     - cmd: '{{ if eq OS "windows" }}powershell {{ end }}mkdir -p {{ .BINARY_DIR }}'
     - cmd: npm pack --pack-destination {{ .BINARY_DIR }}
     - cmd: cd {{ .BINARY_DIR }} && powershell mv "*.tgz" "release.tgz"

  #clean hook
  clean:
    dir: '{{ .USER_WORKING_DIR }}'
    ignore_error: true
    cmds:
    - for: [node_modules/, dist/, bin/]
      cmd: '{{ if eq OS "windows" }}powershell {{ end }}rm -r -Force "{{ .ITEM }}"'

  dev-init:
    desc: 'Initializes the development environment'
    dir: '{{ .USER_WORKING_DIR }}'
    cmds:
    - cmd: npm install
