# https://taskfile.dev

#Called by the vnbuild system to produce builds for my website
#https://www.vaughnnugent.com/resources/software

version: "3"

tasks:

  install:
    internal: true
    requires: { BUILDS_URL, MODULE_NAME, VERSION, PROJECT_NAME, FILE_NAME, DIR, HASH }
    vars:
      DOWNLOAD_URL: '{{ .BUILDS_URL }}/{{ .MODULE_NAME }}/{{ .VERSION }}/{{ .PROJECT_NAME }}/{{ .FILE_NAME }}'
    cmds:
     #make the plugin directory
     - cmd: '{{ .MKDIR }} "{{ .DIR }}"'

     #random delay if using linux
     - cmd: sleep $((RANDOM % 10))
       platforms: [linux, darwin]
       ignore_error: true

     - task: install-internal
       vars:
         DOWNLOAD_URL: '{{ .DOWNLOAD_URL }}'
         FILE_NAME: '{{ .FILE_NAME }}'
         DIR: '{{ .DIR }}'
         HASH: '{{ .HASH }}'

  install-internal:
    internal: true
    requires: { DOWNLOAD_URL, FILE_NAME, DIR, HASH }
    dir: '{{ .DIR }}'
    cmds:
    - cmd: curl -L --output "{{ .FILE_NAME }}" "{{ .DOWNLOAD_URL }}" --fail

    #extract the archive
    - cmd: tar -xzf {{ .FILE_NAME }}

    #remove the archive file
    - cmd: '{{ .RM }} "{{ .FILE_NAME }}"'

    #remove all pckage.json files that could cause build issues
    - cmd: powershell 'Get-ChildItem -Path . -Recurse -File -Filter "package.json" | Remove-Item -Force'
      platforms: [windows]
      ignore_error: true
    
    - cmd: find . -type f -name "package.json" -exec rm -f {} +
      platforms: [linux, darwin]
      ignore_error: true
