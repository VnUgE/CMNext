min_version = "2024.9.5"

[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:libicu-dev" = "latest"
"dnf:gcc" = "latest"

[tools]
node = "24"
dotnet = "8.0"
task = "3.50"
process-compose = "1.110"
cmake = "4.3"

