[env]
DOTNET_CLI_TELEMETRY_OPTOUT=1
DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
CMNEXT_ROOT = "{{ config_root }}/.."
CMNEXT_FRONTEND_DIR = "{{ config_root }}/../front-end"
CMNEXT_BACKEND_DIR = "{{ config_root }}/../back-end"
CMNEXT_SERVER_DIR = "{{ config_root }}/../server"
CMNEXT_LIB_DIR = "{{ config_root }}/../lib"
MINIO_DATA_DIR = "{{ config_root }}/data/minio"
DEV_SERVER_DIR = "{{ config_root }}/server"
_.file = "{{ config_root }}/dev.env"

[tasks.setup]
description = "Pull dependencies and build the server package (first-time setup)"
run = "task mise-setup"

[tasks.dev]
description = "Start dev environment, skip initial setup (for when build already exists)"
run = "process-compose up"

[tasks.dev-debug-server]
run = "task debug-server"

[tasks.clean]
run = "task clean"
